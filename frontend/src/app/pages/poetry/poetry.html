<section>
  <h1>שירה</h1>
  <p>שירים מאת נפתלי.</p>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  } @else if (loading()) {
    <p class="status" aria-live="polite">טוען שירים…</p>
  }

  <div class="grid">
    @for (poem of poems(); track poem.id) {
      <app-poem-card [poem]="poem" />
    }
  </div>
</section>

<section class="whatsapp" aria-label="ניוזלטר">
  <h2>ניוזלטר בוואטסאפ — בקרוב</h2>
  <p>ניתן יהיה להירשם לקבלת שירים חדשים. לא נאסף מספר טלפון בשלב זה.</p>
</section>
