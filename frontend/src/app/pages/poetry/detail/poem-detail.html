<section>
  <a class="back" routerLink="/poetry">חזרה לשירה</a>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  } @else if (loading()) {
    <p class="status" aria-live="polite">טוען שיר…</p>
  }

  @if (poem(); as item) {
    <h1>{{ item.title }}</h1>
    <p class="date">{{ item.date }}</p>
    <p class="body">{{ item.body }}</p>
  }
</section>
