<section>
  <h1>חנות</h1>
  <p>בחרו קטגוריה. המחירים המוצגים הם לדוגמה בלבד.</p>
  <nav class="categories" aria-label="קטגוריות החנות">
    @for (category of categories; track category.id) {
      <a [routerLink]="['/shop', category.id]">{{ category.label }}</a>
    }
  </nav>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  } @else if (loading()) {
    <p class="status" aria-live="polite">טוען מוצרים…</p>
  } @else {
    <div class="grid">
      @for (product of products(); track product.id) {
        <app-product-card
          [product]="product"
          [inCart]="cart.has(product.id)"
          (add)="cart.add(product)"
        />
      }
    </div>
  }
</section>
